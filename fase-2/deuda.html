<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deuda · Vista inicial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap">
<link rel="stylesheet" href="recursos/estilos.css">
<link rel="stylesheet" href="recursos/estilos-fusion.css">

<div class="app" id="app" data-nav="on">
  <header class="header">
    <div class="logo"><img src="recursos/logo-esencial.png" alt="Esencial · Grupo Alemana" width="202" height="45"></div>
    <div class="h-der">
      <div class="h-usuario">
        <img class="h-avatar" src="recursos/avatar.png" alt="" width="48" height="48">
        <div class="h-texto">
          <div class="h-nombre">Carlos Inostroza Martínez</div>
          <div class="h-rol">Ejecutivo Esencial</div>
        </div>
      </div>
      <div class="h-sep"></div>
      <button class="h-campana" type="button" aria-label="Notificaciones">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="h-punto"></span>
      </button>
      <div class="h-sep"></div>
      <button class="h-salir" type="button"><span>Cerrar sesión</span>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </header>

  <div class="cuerpo">
    <nav class="nav" aria-label="Menú principal">
      <div class="nav-titulo">
        <span>Menú</span>
        <button type="button" id="btn-nav" aria-label="Contraer menú">
          <svg width="20" height="18" viewBox="0 0 20 18" fill="currentColor" aria-hidden="true"><path d="M10.2107 15.8273L10.9178 15.1946C11.0852 15.0448 11.0852 14.802 10.9178 14.6523L5.37745 9.69514H17.5714C17.8081 9.69514 18 9.52345 18 9.31168V8.41694C18 8.20518 17.8081 8.03349 17.5714 8.03349H5.37745L10.9178 3.07632C11.0852 2.92658 11.0852 2.68378 10.9178 2.53401L10.2107 1.90137C10.0433 1.75163 9.77199 1.75163 9.6046 1.90137L2.12552 8.59318C1.95816 8.74292 1.95816 8.98571 2.12552 9.13548L9.6046 15.8273C9.77195 15.977 10.0433 15.977 10.2107 15.8273Z"/></svg>
        </button>
      </div>
      <div class="nav-lista" id="nav-lista"></div>
    </nav>

    <main class="main" id="main">
      <div class="pagina">
        <div class="cabecera">
          <h1>Deuda de cotizaciones</h1>
          <div class="migas">
            <span>Inicio</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
            <b>Deuda</b>
          </div>
        </div>

        <div class="contenido">
          <div class="vista-deuda" role="radiogroup" aria-label="Tipo de deuda">
            <a class="vista-op" role="radio" aria-checked="false" href="flujo.html">
              <span class="vista-txt"><b>Deuda del mes</b><span class="vista-sub">Flujo</span></span>
              <span class="vista-radio" aria-hidden="true"></span>
            </a>
            <a class="vista-op" role="radio" aria-checked="false" href="stock.html">
              <span class="vista-txt"><b>Deuda histórica</b><span class="vista-sub">Stock</span></span>
              <span class="vista-radio" aria-hidden="true"></span>
            </a>
            <a class="vista-op" role="radio" aria-checked="false" href="consolidado.html">
              <span class="vista-txt"><b>Deuda consolidada</b><span class="vista-sub">Flujo y stock</span></span>
              <span class="vista-radio" aria-hidden="true"></span>
            </a>
          </div>

          <section class="bloque" aria-labelledby="bloque-titulo">
            <div class="arte"><svg width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18.5 30.5a9.5 9.5 0 1 1 11 0v3.5h-11z"/><path d="M19.5 38.5h9"/><path d="M21 42h6"/><path d="M24 4v3"/><path d="M38 12.5 36 14"/><path d="M10 12.5 12 14"/><path d="M43 26h-3"/><path d="M8 26H5"/></svg></div>
            <h2 id="bloque-titulo">Aún no hay un tipo de deuda seleccionado.</h2>
            <p>Elige el tipo de deuda que quieres consultar.</p>
          </section>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="recursos/inicio.js"></script>
</html>
